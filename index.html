    class SoundManager {
      constructor() { this.ctx = null; this.enabled = true; }
      setEnabled(val) { this.enabled = val; }
      getCtx() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      }
      playSuccess() {
        if (!this.enabled) return;
        try {
          const ctx = this.getCtx(); if (!ctx) return;
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
          osc1.type = 'sine'; osc1.frequency.setValueAtTime(1318.5, now);
          gain1.gain.setValueAtTime(0.25, now); gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc1.connect(gain1); gain1.connect(ctx.destination);
          osc1.start(now); osc1.stop(now + 0.25);

          const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
          osc2.type = 'triangle'; osc2.frequency.setValueAtTime(1760, now + 0.08);
          gain2.gain.setValueAtTime(0.28, now + 0.08); gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc2.connect(gain2); gain2.connect(ctx.destination);
          osc2.start(now + 0.08); osc2.stop(now + 0.45);
        } catch(e) {}
      }
      playDuplicate() {
        if (!this.enabled) return;
        try {
          const ctx = this.getCtx(); if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(740, now + 0.2);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.3);
        } catch(e) {}
      }
      playError() {
        if (!this.enabled) return;
        try {
          const ctx = this.getCtx(); if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(180, now + 0.1);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.28);
        } catch(e) {}
      }
      playUndo() {
        if (!this.enabled) return;
        try {
          const ctx = this.getCtx(); if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(660, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.2);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.25);
        } catch(e) {}
      }
    }

      { id: '59', title: 'การนำเสนอผลงานนวัตกรรมและโปสเตอร์วิชาการ', enabled: false },
      { id: '60', title: 'สรุปการเรียนรู้วิทยาศาสตร์และนวัตกรรม ป.4 ปลายภาค', enabled: false },
    ];

    const STORAGE_KEY = 'single_file_p4_grading_state';
    const FIREBASE_KEY = 'single_file_p4_firebase_config';

    function App() {
      const [students, setStudents] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            if (p && Array.isArray(p.students)) return p.students;
          }
        } catch(e) {}
        return INITIAL_STUDENTS;
      });

      const [worksheets, setWorksheets] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            if (p && Array.isArray(p.worksheets) && p.worksheets.length >= 60) return p.worksheets;
          }
        } catch(e) {}
        return INITIAL_WORKSHEETS;
      });

      const [submissions, setSubmissions] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            if (p && p.submissions) return p.submissions;
          }
        } catch(e) {}
        return { '4101_01': Date.now() - 86400000, '4102_01': Date.now() - 86400000 };
      });

      const [recentLogs, setRecentLogs] = useState([]);
      const [activeTab, setActiveTab] = useState('fast');
      const [isCloudConnected, setIsCloudConnected] = useState(false);
      const [showCloudModal, setShowCloudModal] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);

      const [selectedWsId, setSelectedWsId] = useState('01');
      const [selectedRoom, setSelectedRoom] = useState('p4_1');
      const [inputCode, setInputCode] = useState('');
      const [showKeypad, setShowKeypad] = useState(true);
      const [confirmation, setConfirmation] = useState(null);
      const [errorMsg, setErrorMsg] = useState(null);
      const [editingWsId, setEditingWsId] = useState(null);
      const [editWsTitle, setEditWsTitle] = useState('');
      const inputRef = useRef(null);

      const saveLocal = (newStudents, newWs, newSubs, newLogs) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            students: newStudents, worksheets: newWs, submissions: newSubs, recentLogs: newLogs, lastUpdated: Date.now()
          }));
        } catch(e) {}
      };

      const commit = (newStudents, newWs, newSubs, newLogs) => {
        setStudents(newStudents); setWorksheets(newWs); setSubmissions(newSubs); setRecentLogs(newLogs);
        saveLocal(newStudents, newWs, newSubs, newLogs);
        if (window.firebaseDbRef) {
          try {
            window.firebaseDbRef.set({
              students: newStudents, worksheets: newWs, submissions: newSubs, recentLogs: newLogs.slice(0, 30), lastUpdated: Date.now()
            });
          } catch(e) {}
        }
      };

      useEffect(() => {
        try {
          const savedConfig = localStorage.getItem(FIREBASE_KEY);
          if (savedConfig && window.firebase) {
            const cfg = JSON.parse(savedConfig);
            if (cfg.apiKey && cfg.projectId) {
              if (!firebase.apps.length) firebase.initializeApp(cfg);
              const db = firebase.database();
              const ref = db.ref('p4_grading_system/state');
              window.firebaseDbRef = ref;
              setIsCloudConnected(true);
              ref.on('value', (snap) => {
                const val = snap.val();
                if (val && val.students) {
                  setStudents(val.students);
                  setWorksheets(val.worksheets || INITIAL_WORKSHEETS);
                  setSubmissions(val.submissions || {});
                  setRecentLogs(val.recentLogs || []);
                  saveLocal(val.students, val.worksheets, val.submissions, val.recentLogs);
                }
              });
            }
          }
        } catch(e) {}
      }, []);

      const focusInput = () => { if (inputRef.current) inputRef.current.focus(); };

      const handleFastSubmit = (code) => {
        const clean = (code || inputCode).trim();
        if (clean.length !== 4) {
          sound.playError(); setErrorMsg(`รหัสต้องมี 4 หลัก (ที่คุณพิมพ์: ${clean})`);
          setTimeout(() => setErrorMsg(null), 2500); return;
        }

        const student = students.find(s => s.id === clean);
        if (!student) {
          sound.playError(); setErrorMsg(`ไม่พบรหัสนักเรียน "${clean}" ในระบบ`);
          setTimeout(() => setErrorMsg(null), 2500); setInputCode(''); focusInput(); return;
        }

        const currentWs = worksheets.find(w => w.id === selectedWsId) || worksheets[0];
        const subKey = `${student.id}_${selectedWsId}`;
        const isDuplicate = !!submissions[subKey];
        const newSubs = { ...submissions, [subKey]: Date.now() };
        const roomName = CLASSROOMS.find(c => c.id === student.room)?.name || student.room;

        const newLog = {
          id: 'log_' + Date.now(), studentId: student.id, studentName: student.name,
          room: student.room, roomName, worksheetId: selectedWsId, worksheetTitle: currentWs.title, timestamp: Date.now()
        };
        const newLogs = [newLog, ...recentLogs.filter(l => !(l.studentId === student.id && l.worksheetId === selectedWsId))].slice(0, 30);

        commit(students, worksheets, newSubs, newLogs);
        setErrorMsg(null); setInputCode('');
        if (isDuplicate) sound.playDuplicate(); else sound.playSuccess();

        setConfirmation({ student, worksheet: currentWs, roomName, isDuplicate });
        setTimeout(() => setConfirmation(null), 1800);
        focusInput();
      };

      const handleUndo = (log) => {
        sound.playUndo();
        const subKey = `${log.studentId}_${log.worksheetId}`;
        const newSubs = { ...submissions };
        delete newSubs[subKey];
        commit(students, worksheets, newSubs, recentLogs.filter(l => l.id !== log.id));
      };

      const toggleDot = (studentId, wsId) => {
        const subKey = `${studentId}_${wsId}`;
        const newSubs = { ...submissions };
        if (newSubs[subKey]) delete newSubs[subKey];
        else newSubs[subKey] = Date.now();
        commit(students, worksheets, newSubs, recentLogs);
      };

      const handleExportExcel = (targetRoom = 'all') => {
        if (typeof XLSX === 'undefined') { alert('ไม่พบไลบรารี SheetJS'); return; }
        const wb = XLSX.utils.book_new();
        const enabledWs = worksheets.filter(w => w.enabled);
        const roomsToExport = targetRoom === 'all' ? CLASSROOMS : CLASSROOMS.filter(c => c.id === targetRoom);

        roomsToExport.forEach(room => {
          const rStudents = students.filter(s => s.room === room.id).sort((a,b) => a.no - b.no);
          const rows = rStudents.map(student => {
            let submitted = 0; const wsCols = {};
            enabledWs.forEach(w => {
              const ok = !!submissions[`${student.id}_${w.id}`];
              if (ok) submitted++;
              wsCols[`ใบงาน ${w.id}: ${w.title}`] = ok ? '✓ ส่งแล้ว' : '✗ ยังไม่ส่ง';
            });
            const pending = enabledWs.length - submitted;
            const score = enabledWs.length > 0 ? Number(((submitted / enabledWs.length) * 30).toFixed(2)) : 0;
            return {
              'รหัสนักเรียน': student.id, 'เลขที่': student.no, 'ชื่อ - นามสกุล': student.name, 'ห้องเรียน': room.name,
              ...wsCols, 'รวมส่งแล้ว (งาน)': submitted, 'รวมค้างส่ง (งาน)': pending, 'คะแนนเก็บ (เต็ม 30)': score,
            };
          });
          const ws = XLSX.utils.json_to_sheet(rows.length > 0 ? rows : [{ 'ข้อความ': 'ไม่มีข้อมูล' }]);
          XLSX.utils.book_append_sheet(wb, ws, `ห้อง ${room.name}`);
        });

        const dateStr = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, `รายงานการส่งงานวิทยาศาสตร์และนวัตกรรม_ป4_${dateStr}.xlsx`);
      };

      const enabledWorksheets = worksheets.filter(w => w.enabled);
      const filteredStudents = selectedRoom === 'all' ? students : students.filter(s => s.room === selectedRoom);
      const unsubmittedInRoom = filteredStudents.filter(s => !submissions[`${s.id}_${selectedWsId}`]);
      const submittedInRoom = filteredStudents.filter(s => !!submissions[`${s.id}_${selectedWsId}`]);

      return (
        <div className="min-h-screen flex flex-col">
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-700 flex items-center justify-center text-white text-xl shadow-sm">
                  🔬
                </div>
                <div>
                  <h1 className="font-extrabold text-sm sm:text-base text-slate-800 leading-tight">
                    ระบบตรวจงานวิทยาศาสตร์และนวัตกรรม ป.4
                  </h1>
                  <p className="text-[11px] text-slate-500">
                    ติดตามการส่งงานแบบ Real-time แยกห้อง ป.4/1 - ป.4/4
                  </p>
                </div>
              </div>

              <div className="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-2xl text-xs font-semibold">
                <button onClick={() => setActiveTab('fast')} className={`px-3 py-1.5 rounded-xl transition ${activeTab === 'fast' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                  🎯 ตรวจงานด่วน 4 หลัก
                </button>
                <button onClick={() => setActiveTab('matrix')} className={`px-3 py-1.5 rounded-xl transition ${activeTab === 'matrix' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                  📊 ตารางสรุปคะแนน
                </button>
                <button onClick={() => setActiveTab('worksheets')} className={`px-3 py-1.5 rounded-xl transition ${activeTab === 'worksheets' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                  📝 จัดการใบงาน (60)
                </button>
                <button onClick={() => setActiveTab('students')} className={`px-3 py-1.5 rounded-xl transition ${activeTab === 'students' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                  👥 จัดการนักเรียน
                </button>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => handleExportExcel('all')} className="hidden sm:inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold">
                  📑 Excel
                </button>
                <button onClick={() => setShowCloudModal(true)} className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold border ${isCloudConnected ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>
                  <span>{isCloudConnected ? '🟢 ซิงค์คลาวด์สด' : '⚪ ตั้งค่า Cloud'}</span>
                </button>
              </div>
            </div>

            <div className="flex md:hidden items-center justify-around py-2 border-t border-slate-100 text-xs font-semibold bg-white">
              <button onClick={() => setActiveTab('fast')} className={`px-2 py-1 rounded-lg ${activeTab === 'fast' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>
                🎯 ตรวจด่วน
              </button>
              <button onClick={() => setActiveTab('matrix')} className={`px-2 py-1 rounded-lg ${activeTab === 'matrix' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>
                📊 ตารางคะแนน
              </button>
              <button onClick={() => setActiveTab('worksheets')} className={`px-2 py-1 rounded-lg ${activeTab === 'worksheets' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>
                📝 ใบงาน (60)
              </button>
              <button onClick={() => setActiveTab('students')} className={`px-2 py-1 rounded-lg ${activeTab === 'students' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>
                👥 นักเรียน
              </button>
            </div>
          </header>

          {confirmation && (
            <div onClick={() => setConfirmation(null)} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs cursor-pointer">
              <div className={`w-full max-w-md rounded-3xl p-6 text-white shadow-2xl border-4 text-center animate-scaleIn ${confirmation.isDuplicate ? 'bg-gradient-to-br from-amber-500 to-amber-600 border-amber-300' : 'bg-gradient-to-br from-emerald-600 to-teal-700 border-emerald-300'}`}>
                <div className="text-4xl mb-2">{confirmation.isDuplicate ? '⚠️' : '✅'}</div>
                <div className="text-xs font-bold uppercase tracking-wider mb-1">
                  {confirmation.isDuplicate ? 'ส่งซ้ำ (เคยบันทึกไว้แล้ว)' : 'บันทึกการส่งงานสำเร็จ'}
                </div>
                <h2 className="text-2xl font-bold">{confirmation.student.name}</h2>
                <div className="flex items-center justify-center gap-2 my-3 text-sm font-semibold">
                  <span className="px-3 py-1 bg-white/20 rounded-xl font-mono text-base">รหัส {confirmation.student.id}</span>
                  <span className="px-3 py-1 bg-white/20 rounded-xl">เลขที่ {confirmation.student.no}</span>
                  <span className="px-3 py-1 bg-white/20 rounded-xl">{confirmation.roomName}</span>
                </div>
                <div className="bg-black/20 p-2.5 rounded-xl text-xs">
                  ใบงานที่ {confirmation.worksheet.id}: {confirmation.worksheet.title}
                </div>
              </div>
            </div>
          )}

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
            
            {/* VIEW 1: FAST ENTRY */}
            {activeTab === 'fast' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-4 sm:p-6 border border-slate-200 shadow-xs">
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                    <div className="md:col-span-6">
                      <label className="block text-xs font-semibold text-slate-500 mb-1">
                        1. เลือกใบงานที่ตรวจ ({enabledWorksheets.length}/60 ใบงานที่เปิดใช้):
                      </label>
                      <select 
                        value={selectedWsId}
                        onChange={(e) => { setSelectedWsId(e.target.value); focusInput(); }}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-medium text-xs sm:text-sm"
                      >
                        {worksheets.map(w => (
                          <option key={w.id} value={w.id}>
                            #{w.id} {w.title} {!w.enabled ? '(ปิดใช้งาน)' : ''}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="md:col-span-4">
                      <label className="block text-xs font-semibold text-slate-500 mb-1">
                        2. เลือกห้องเรียน:
                      </label>
                      <div className="grid grid-cols-5 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                        {CLASSROOMS.map(c => (
                          <button key={c.id} onClick={() => { setSelectedRoom(c.id); focusInput(); }} className={`py-1.5 rounded-lg text-center ${selectedRoom === c.id ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600'}`}>
                            {c.name}
                          </button>
                        ))}
                        <button onClick={() => { setSelectedRoom('all'); focusInput(); }} className={`py-1.5 rounded-lg text-center ${selectedRoom === 'all' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600'}`}>
                          ทุกห้อง
                        </button>
                      </div>
                    </div>

                    <div className="md:col-span-2 flex items-center justify-end gap-2 pt-2 md:pt-4">
                      <button onClick={() => { const n = !soundEnabled; sound.setEnabled(n); setSoundEnabled(n); }} className="px-3 py-2 rounded-xl text-xs font-medium border bg-slate-50">
                        {soundEnabled ? '🔊 มีเสียง' : '🔇 ปิดเสียง'}
                      </button>
                      <button onClick={() => setShowKeypad(!showKeypad)} className="px-3 py-2 rounded-xl text-xs font-medium border bg-slate-50">
                        {showKeypad ? 'ซ่อนแป้น' : 'แป้นตัวเลข'}
                      </button>
                    </div>
                  </div>

                  <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600">
                    <div>ส่งแล้ว <strong>{submittedInRoom.length}</strong> จาก {filteredStudents.length} คน ({filteredStudents.length > 0 ? Math.round((submittedInRoom.length/filteredStudents.length)*100) : 0}%)</div>
                    <div className="w-48 h-2 bg-slate-100 rounded-full overflow-hidden">
                      <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${filteredStudents.length > 0 ? (submittedInRoom.length/filteredStudents.length)*100 : 0}%` }} />
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-7 bg-white rounded-2xl p-6 border border-slate-200 shadow-xs flex flex-col items-center text-center">
                    <span className="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 mb-2">
                      ⚡ โหมดคีย์ด่วน 4 หลัก (พิมพ์ครบ 4 ตัว บันทึกทันที)
                    </span>
                    <h3 className="text-lg font-bold text-slate-800">พิมพ์รหัสนักเรียน 4 หลัก</h3>
                    <p className="text-xs text-slate-400 mb-4">เช่น 4101..4140, 4201..4240, 4301, 4401</p>

                    <input 
                      ref={inputRef}
                      type="text"
                      inputMode="numeric"
                      maxLength={4}
                      value={inputCode}
                      onChange={(e) => {
                        const val = e.target.value.replace(/\D/g, '').slice(0, 4);
                        setInputCode(val);
                        if (val.length === 4) handleFastSubmit(val);
                      }}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && inputCode) handleFastSubmit(inputCode);
                      }}
                      placeholder="____"
                      className="w-full max-w-xs text-center font-mono text-4xl font-extrabold tracking-[0.3em] py-3 bg-slate-50 rounded-2xl border-2 border-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-100 text-slate-800 mb-2 shadow-inner"
                      autoFocus
                    />

                    {errorMsg && (
                      <div className="text-xs text-rose-600 bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg mb-2">
                        {errorMsg}
                      </div>
                    )}

                    {showKeypad && (
                      <div className="w-full max-w-xs pt-2">
                        <div className="grid grid-cols-3 gap-2">
                          {['1','2','3','4','5','6','7','8','9'].map(d => (
                            <button key={d} onClick={() => {
                              const next = (inputCode + d).slice(0, 4);
                              setInputCode(next);
                              focusInput();
                              if (next.length === 4) handleFastSubmit(next);
                            }} className="h-14 rounded-2xl bg-slate-100 active:bg-emerald-200 font-mono text-2xl font-bold shadow-xs border border-slate-200">
                              {d}
                            </button>
                          ))}
                          <button onClick={() => { setInputCode(''); focusInput(); }} className="h-14 rounded-2xl bg-rose-50 text-rose-600 text-sm font-semibold border border-rose-200">
                            ล้าง
                          </button>
                          <button onClick={() => {
                            const next = (inputCode + '0').slice(0, 4);
                            setInputCode(next);
                            focusInput();
                            if (next.length === 4) handleFastSubmit(next);
                          }} className="h-14 rounded-2xl bg-slate-100 active:bg-emerald-200 font-mono text-2xl font-bold shadow-xs border border-slate-200">
                            0
                          </button>
                          <button onClick={() => { setInputCode(prev => prev.slice(0, -1)); focusInput(); }} className="h-14 rounded-2xl bg-amber-50 text-amber-700 text-base font-bold border border-amber-200">
                            ⌫
                          </button>
                        </div>
                      </div>
                    )}

                    <div className="w-full mt-5 pt-4 border-t border-slate-100 text-left">
                      <div className="text-xs font-bold text-slate-700 mb-2">
                        ยังไม่ส่งงานนี้ ({unsubmittedInRoom.length} คน) - คลิกเพื่อบันทึกทันที:
                      </div>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5 max-h-36 overflow-y-auto custom-scrollbar text-xs">
                        {unsubmittedInRoom.map(s => (
                          <button key={s.id} onClick={() => handleFastSubmit(s.id)} className="p-2 bg-slate-50 hover:bg-emerald-50 rounded-xl border border-slate-200 text-left">
                            <span className="font-mono font-bold text-emerald-800">#{s.id}</span> {s.name}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="lg:col-span-5 bg-white rounded-2xl p-5 border border-slate-200 shadow-xs flex flex-col h-[520px]">
                    <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-2">
                      <h3 className="font-bold text-slate-800 text-sm">ประวัติการตรวจล่าสุด</h3>
                      <span className="text-xs text-slate-400">{recentLogs.length} รายการ</span>
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-1">
                      {recentLogs.length === 0 ? (
                        <div className="h-full flex items-center justify-center text-xs text-slate-400">
                          ยังไม่มีประวัติการส่งงาน
                        </div>
                      ) : (
                        recentLogs.map((log, idx) => (
                          <div key={log.id} className={`p-2.5 rounded-xl border flex items-center justify-between gap-2 text-xs ${idx === 0 ? 'bg-emerald-50/70 border-emerald-300' : 'bg-slate-50 border-slate-200'}`}>
                            <div className="min-w-0">
                              <div className="font-mono font-bold text-emerald-800">{log.studentId} ({log.roomName})</div>
                              <div className="font-semibold text-slate-800 truncate">{log.studentName}</div>
                              <div className="text-slate-500 truncate">ใบงาน {log.worksheetId}: {log.worksheetTitle}</div>
                            </div>
                            <button onClick={() => handleUndo(log)} className="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-600 hover:text-white text-rose-600 rounded-lg text-xs font-semibold border border-rose-200">
                              ยกเลิก
                            </button>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: MATRIX */}
            {activeTab === 'matrix' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-4 sm:p-6 border border-slate-200 shadow-xs flex flex-col md:flex-row items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800">ตารางสรุปผลการส่งงาน (Matrix)</h2>
                    <p className="text-xs text-slate-500">คิดคะแนนเต็ม 30 คะแนนจากใบงานที่เปิดใช้งานจริง ({enabledWorksheets.length} ใบงาน)</p>
                  </div>
                  <div className="flex items-center gap-2">
                    {CLASSROOMS.map(c => (
                      <button key={c.id} onClick={() => setSelectedRoom(c.id)} className={`px-3 py-1.5 rounded-xl text-xs font-semibold ${selectedRoom === c.id ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}`}>
                        {c.name}
                      </button>
                    ))}
                    <button onClick={() => handleExportExcel(selectedRoom)} className="px-3.5 py-1.5 rounded-xl bg-slate-800 text-white text-xs font-semibold">
                      ส่งออก Excel
                    </button>
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
                  <div className="overflow-x-auto custom-scrollbar">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="bg-slate-100 text-slate-700 border-b border-slate-200">
                          <th className="py-3 px-3 w-20 text-center sticky left-0 bg-slate-100 z-10">รหัส</th>
                          <th className="py-3 px-3 min-w-[170px] sticky left-20 bg-slate-100 z-10">เลขที่ / ชื่อ-สกุล</th>
                          {enabledWorksheets.map(w => (
                            <th key={w.id} className="py-3 px-1.5 text-center font-mono min-w-[45px]" title={w.title}>
                              #{w.id}
                            </th>
                          ))}
                          <th className="py-3 px-3 text-center bg-emerald-50 text-emerald-800 font-bold min-w-[65px]">ส่งแล้ว</th>
                          <th className="py-3 px-3 text-center bg-rose-50 text-rose-800 font-bold min-w-[65px]">ค้าง</th>
                          <th className="py-3 px-3 text-center bg-indigo-50 text-indigo-900 font-bold min-w-[85px]">คะแนน (/30)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {students.filter(s => s.room === selectedRoom).sort((a,b) => a.no - b.no).map(student => {
                          let submitted = 0;
                          enabledWorksheets.forEach(w => {
                            if (submissions[`${student.id}_${w.id}`]) submitted++;
                          });
                          const pending = enabledWorksheets.length - submitted;
                          const score = enabledWorksheets.length > 0 ? ((submitted / enabledWorksheets.length) * 30).toFixed(2) : 0;

                          return (
                            <tr key={student.id} className="hover:bg-slate-50">
                              <td className="py-2.5 px-3 text-center font-mono font-bold sticky left-0 bg-white">{student.id}</td>
                              <td className="py-2.5 px-3 sticky left-20 bg-white font-medium">#{student.no} {student.name}</td>
                              {enabledWorksheets.map(w => {
                                const ok = !!submissions[`${student.id}_${w.id}`];
                                return (
                                  <td key={w.id} className="py-2.5 px-1.5 text-center">
                                    <button onClick={() => toggleDot(student.id, w.id)} className="cursor-pointer">
                                      {ok ? (
                                        <span className="w-4 h-4 rounded-full bg-emerald-500 text-white text-[10px] inline-flex items-center justify-center font-bold">✓</span>
                                      ) : (
                                        <span className="w-3.5 h-3.5 rounded-full bg-rose-500/80 inline-block"></span>
                                      )}
                                    </button>
                                  </td>
                                );
                              })}
                              <td className="py-2.5 px-3 text-center font-bold text-emerald-700 bg-emerald-50/40">{submitted}</td>
                              <td className="py-2.5 px-3 text-center font-bold text-rose-600 bg-rose-50/40">{pending}</td>
                              <td className="py-2.5 px-3 text-center font-extrabold text-indigo-700 bg-indigo-50/40">{score}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 3: WORKSHEETS (60) - พร้อมฟังก์ชันแก้ไขชื่อใบงาน */}
            {activeTab === 'worksheets' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs flex flex-col md:flex-row items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800">จัดการใบงานวิทยาศาสตร์และนวัตกรรม (60 ใบงาน)</h2>
                    <p className="text-xs text-slate-500">คลิกที่ชื่อใบงานหรือกดปุ่ม ✏️ เพื่อแก้ไขชื่อใบงานได้ตลอดเวลา</p>
                  </div>
                  <div className="flex flex-wrap items-center gap-1.5 text-xs font-semibold">
                    <button onClick={() => {
                      const next = worksheets.map((w, i) => ({ ...w, enabled: i < 15 }));
                      commit(students, next, submissions, recentLogs);
                    }} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">
                      เปิด 15 ใบแรก
                    </button>
                    <button onClick={() => {
                      const next = worksheets.map((w, i) => ({ ...w, enabled: i < 30 }));
                      commit(students, next, submissions, recentLogs);
                    }} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">
                      เปิด 30 ใบแรก
                    </button>
                    <button onClick={() => {
                      const next = worksheets.map(w => ({ ...w, enabled: true }));
                      commit(students, next, submissions, recentLogs);
                    }} className="px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-800">
                      เปิดหมด 60 ใบ
                    </button>
                    <button onClick={() => {
                      const next = worksheets.map(w => ({ ...w, enabled: false }));
                      commit(students, next, submissions, recentLogs);
                    }} className="px-3 py-1.5 rounded-lg bg-rose-100 text-rose-800">
                      ปิดทั้งหมด
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  {worksheets.map(w => {
                    const isEditing = editingWsId === w.id;
                    return (
                      <div key={w.id} className={`p-3.5 rounded-2xl border text-xs flex flex-col justify-between gap-2.5 transition ${w.enabled ? 'bg-white border-emerald-300 shadow-2xs' : 'bg-slate-50 border-slate-200 opacity-80'}`}>
                        <div className="flex items-start justify-between gap-2">
                          <span className={`px-2 py-0.5 rounded-md font-mono font-bold text-xs ${w.enabled ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>
                            #{w.id}
                          </span>
                          <button onClick={() => {
                            const next = worksheets.map(x => x.id === w.id ? { ...x, enabled: !x.enabled } : x);
                            commit(students, next, submissions, recentLogs);
                          }} className={`px-2.5 py-1 rounded-lg font-bold shrink-0 text-[11px] cursor-pointer ${w.enabled ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>
                            {w.enabled ? 'เปิดใช้งาน' : 'ปิดอยู่'}
                          </button>
                        </div>

                        {/* กล่องแก้ไขชื่อ หรือ แสดงชื่อ */}
                        {isEditing ? (
                          <div className="space-y-2 pt-1">
                            <input
                              type="text"
                              value={editWsTitle}
                              onChange={(e) => setEditWsTitle(e.target.value)}
                              onKeyDown={(e) => {
                                if (e.key === 'Enter') {
                                  if (editWsTitle.trim()) {
                                    const next = worksheets.map(x => x.id === w.id ? { ...x, title: editWsTitle.trim() } : x);
                                    commit(students, next, submissions, recentLogs);
                                  }
                                  setEditingWsId(null);
                                }
                                if (e.key === 'Escape') setEditingWsId(null);
                              }}
                              className="w-full p-2 bg-white border border-emerald-400 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-emerald-400"
                              autoFocus
                            />
                            <div className="flex items-center gap-1.5">
                              <button onClick={() => {
                                if (editWsTitle.trim()) {
                                  const next = worksheets.map(x => x.id === w.id ? { ...x, title: editWsTitle.trim() } : x);
                                  commit(students, next, submissions, recentLogs);
                                }
                                setEditingWsId(null);
                              }} className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold cursor-pointer">
                                บันทึกชื่อ
                              </button>
                              <button onClick={() => setEditingWsId(null)} className="px-2.5 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs cursor-pointer">
                                ยกเลิก
                              </button>
                            </div>
                          </div>
                        ) : (
                          <div className="space-y-2">
                            <div 
                              onClick={() => { setEditingWsId(w.id); setEditWsTitle(w.title); }}
                              className="font-semibold text-slate-800 text-xs sm:text-sm leading-snug cursor-pointer hover:text-emerald-700 transition"
                              title="คลิกเพื่อแก้ไขชื่อใบงาน"
                            >
                              {w.title}
                            </div>
                            <div className="pt-1 border-t border-slate-100 flex items-center justify-between">
                              <button 
                                onClick={() => { setEditingWsId(w.id); setEditWsTitle(w.title); }}
                                className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-slate-100 hover:bg-emerald-50 text-slate-600 hover:text-emerald-700 font-medium text-[11px] border border-slate-200 cursor-pointer"
                              >
                                <span>✏️ แก้ไขชื่อ</span>
                              </button>
                              <span className="text-[10px] text-slate-400">ใบงาน #{w.id}</span>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* VIEW 4: STUDENTS */}
            {activeTab === 'students' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs flex flex-col md:flex-row items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800">จัดการรายชื่อนักเรียน (ป.4/1 - ป.4/4)</h2>
                    <p className="text-xs text-slate-500">รวมทั้งหมด {students.length} คน</p>
                  </div>
                  <div className="flex items-center gap-2">
                    {CLASSROOMS.map(c => (
                      <button key={c.id} onClick={() => setSelectedRoom(c.id)} className={`px-3 py-1.5 rounded-xl text-xs font-semibold ${selectedRoom === c.id ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}`}>
                        {c.name} ({students.filter(s => s.room === c.id).length})
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="bg-slate-100 text-slate-700 border-b border-slate-200 font-semibold">
                        <th className="py-3 px-4 w-16 text-center">เลขที่</th>
                        <th className="py-3 px-4 w-28 text-center">รหัส 4 หลัก</th>
                        <th className="py-3 px-4">ชื่อ - นามสกุล</th>
                        <th className="py-3 px-4 w-24 text-center">ห้อง</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {students.filter(s => s.room === selectedRoom).sort((a,b) => a.no - b.no).map(s => (
                        <tr key={s.id} className="hover:bg-slate-50">
                          <td className="py-2.5 px-4 text-center font-mono font-bold text-slate-400">#{s.no}</td>
                          <td className="py-2.5 px-4 text-center font-mono font-bold text-emerald-800">{s.id}</td>
                          <td className="py-2.5 px-4 font-semibold text-slate-800">{s.name}</td>
                          <td className="py-2.5 px-4 text-center text-slate-500">{CLASSROOMS.find(c => c.id === s.room)?.name}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* Cloud Modal */}
          {showCloudModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full border border-slate-200 shadow-xl space-y-4 animate-scaleIn text-xs">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="font-bold text-base text-slate-800">ตั้งค่า Real-time Cloud (Firebase)</h3>
                  <button onClick={() => setShowCloudModal(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                </div>
                <p className="text-slate-500">
                  วางโค้ด firebaseConfig เพื่อซิงค์ข้อมูลสดระหว่างมือถือกับคอมพิวเตอร์
                </p>
                <textarea 
                  id="fbConfigText"
                  rows={4}
                  placeholder='วาง const firebaseConfig = { apiKey: "...", projectId: "..." };'
                  className="w-full p-2.5 font-mono bg-slate-50 border border-slate-200 rounded-xl"
                />
                <button 
                  onClick={() => {
                    const txt = document.getElementById('fbConfigText').value;
                    try {
                      const clean = txt.replace(/const\s+\w+\s*=\s*/g, '').replace(/;/g, '').replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g, '$1"$2":');
                      const cfg = JSON.parse(clean);
                      if (cfg.apiKey && cfg.projectId) {
                        localStorage.setItem(FIREBASE_KEY, JSON.stringify(cfg));
                        alert('บันทึกเรียบร้อย! โปรดรีเฟรชหน้าเว็บ 1 ครั้งเพื่อเริ่มการซิงค์สด');
                        setShowCloudModal(false);
                      } else {
                        alert('รูปแบบไม่ถูกต้อง ต้องมี apiKey และ projectId');
                      }
                    } catch(e) {
                      alert('แปลงโค้ดไม่สำเร็จ ตรวจสอบความถูกต้องของ JSON');
                    }
                  }}
                  className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold"
                >
                  บันทึกและเชื่อมต่อ
                </button>
                <div className="pt-2 border-t border-slate-100 flex justify-between text-[11px] text-slate-400">
                  <button onClick={() => {
                    const blob = new Blob([JSON.stringify({ students, worksheets, submissions })], { type: 'application/json' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = `backup_p4_${new Date().toISOString().slice(0,10)}.json`; a.click();
                  }} className="text-indigo-600 underline">ดาวน์โหลด Backup (.json)</button>
                  <button onClick={() => {
                    if (confirm('รีเซ็ตข้อมูลตัวอย่างทั้งหมดหรือไม่?')) {
                      commit(INITIAL_STUDENTS, INITIAL_WORKSHEETS, {}, []);
                      setShowCloudModal(false);
                    }
                  }} className="text-rose-600 underline">รีเซ็ตข้อมูล</button>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-400">
            ระบบตรวจงานวิทยาศาสตร์และนวัตกรรม ป.4 (ห้อง ป.4/1 - ป.4/4) • Single-File HTML Ready
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
